provider: pico4
human_format: pico_bridge
robot_name: unitree_g1
human_height: 1.75
pico4_timeout: 60.0   # seconds to wait for first pico-bridge body frame
pico4_buffer_size: 60
pico4_timestamp_gap_reset_s: 0.15
pause_button: A
pause_debounce_s: 0.25
arms_button: B
arms_debounce_s: 0.25
bridge_host: "0.0.0.0"
bridge_port: 63901
bridge_discovery: true
bridge_advertise_ip: null
bridge_start_timeout: 10.0
bridge_history_size: 120
# Upper-body mocap source (mocap map): "body" = PICO body tracking (default,
# unchanged behavior); "tracker" = synthesize arms from HMD + 2 motion
# trackers (requires pico-bridge >= 0.2.3; device gets motion streaming on
# via BridgeControl). Synthesizer constants (neck_shoulder_m,
# shoulder_width_m, chest_offset_m, elbow_lateral_m, tracker_offset, hold_s)
# override via tracker_synth_config.
arm_source: body
tracker_synth_config: null
video:
  enabled: false
  source: null
  width: 1280
  height: 720
  fps: 30
  device: null
